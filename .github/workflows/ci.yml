name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOT_TOKEN: ci-test-token
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  ENCRYPTION_KEY: ci-test-encryption-key
  JWT_SECRET: ci-test-jwt-secret-with-more-than-32-characters
  ADMIN_USER_IDS: '[123456789]'
  TRADING_DRY_RUN: 'true'
  NEWS_PROTECTION_ENABLED: 'false'
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q bot config core database gateway_client services utils web main.py

      - name: Run tests with coverage
        run: >-
          python -m coverage run
          --source=bot,config,core,database,gateway_client,services,utils,web
          -m pytest -q --disable-warnings

      - name: Build coverage reports
        run: |
          python -m coverage report -m
          python -m coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Advisory static checks
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Flake8
        run: python -m flake8 bot config core database gateway_client services utils web main.py

      - name: Run mypy
        run: python -m mypy bot config core database gateway_client services utils web main.py
